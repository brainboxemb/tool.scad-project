[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scad-project"
version = "0.9.13"
description = "Reusable workflow tooling for configuration-driven OpenSCAD projects."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
scons = ["SCons==4.11.1"]

[project.scripts]
scad-project = "scad_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]