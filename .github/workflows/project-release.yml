name: Reusable SCAD project release

on:
  workflow_call:
    inputs:
      version:
        description: Immutable release version, e.g. v0.1.0
        required: true
        type: string
      source_sha:
        description: Exact 40-character source commit SHA to release
        required: true
        type: string
      build_path:
        description: Generated build root used by the project
        required: false
        type: string
        default: bld
      verification_path:
        description: Generated verification root used by the project
        required: false
        type: string
        default: vrf/out

permissions:
  contents: write
  packages: read

jobs:
  build:
    uses: brainboxemb/tool.scad-project/.github/workflows/project-build.yml@feature/versioned-project-release
    with:
      artifact_name: scad-project-release-build
      publish: false
      source_ref: ${{ inputs.source_sha }}
      release_version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}

  verify:
    uses: brainboxemb/tool.scad-project/.github/workflows/project-verify.yml@feature/versioned-project-release
    with:
      artifact_name: scad-project-release-verification
      publish: false
      verification_path: ${{ inputs.verification_path }}
      source_ref: ${{ inputs.source_sha }}
      release_version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}

  finalize:
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read

    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      SCAD_PROJECT_RELEASE_VERSION: ${{ inputs.version }}
      SCAD_PROJECT_SOURCE_SHA: ${{ inputs.source_sha }}

    steps:
      - name: Checkout exact release source and pinned submodules
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        timeout-minutes: 2
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned project tooling
        timeout-minutes: 2
        run: python -m pip install -e ./tools/tool.scad-project

      - name: Download verified build output
        timeout-minutes: 2
        uses: actions/download-artifact@v4
        with:
          name: scad-project-release-build
          path: ${{ inputs.build_path }}

      - name: Download verified verification output
        timeout-minutes: 2
        uses: actions/download-artifact@v4
        with:
          name: scad-project-release-verification
          path: ${{ inputs.verification_path }}

      - name: Configure Git publication credentials
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate release namespace
        id: preflight
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release version must match vX.Y.Z" >&2
            exit 1
          fi
          if [[ ! "${RELEASE_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: source_sha must be an exact 40-character commit SHA" >&2
            exit 1
          fi

          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "${ACTUAL_SHA}" != "${RELEASE_SOURCE_SHA}" ]]; then
            echo "ERROR: checked-out source ${ACTUAL_SHA} != requested ${RELEASE_SOURCE_SHA}" >&2
            exit 1
          fi

          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${RELEASE_VERSION}" >/dev/null; then
            echo "ERROR: release tag already exists: ${RELEASE_VERSION}" >&2
            exit 1
          fi
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "ERROR: GitHub Release already exists: ${RELEASE_VERSION}" >&2
            exit 1
          fi

          python - <<'PY'
          import os
          from pathlib import Path
          from scad_project.config import load_context
          from scad_project.release import release_branches

          ctx = load_context(Path.cwd())
          branches = release_branches(ctx, os.environ["RELEASE_VERSION"])
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"build_branch={branches.build_branch}\n")
              handle.write(f"verification_branch={branches.verification_branch}\n")
          PY

      - name: Package release downloads
        timeout-minutes: 3
        run: |
          set -euo pipefail
          scad-project release-package \
            --version "${RELEASE_VERSION}" \
            --output-dir .release

      - name: Prepare release notes
        timeout-minutes: 2
        env:
          BUILD_BRANCH: ${{ steps.preflight.outputs.build_branch }}
          VERIFICATION_BRANCH: ${{ steps.preflight.outputs.verification_branch }}
        run: |
          set -euo pipefail
          cat > .release/RELEASE_NOTES.md <<EOF
          Release **${RELEASE_VERSION}** from source commit \`${RELEASE_SOURCE_SHA}\`.

          Browse generated release documentation directly on GitHub:

          - [Build and design documentation](https://github.com/${GITHUB_REPOSITORY}/tree/${BUILD_BRANCH})
          - [Verification evidence](https://github.com/${GITHUB_REPOSITORY}/tree/${VERIFICATION_BRANCH})

          Downloadable build, verification and STL bundles are attached to this release together with \`SHA256SUMS.txt\`.
          EOF

      - name: Publish immutable release branches
        id: publish-branches
        timeout-minutes: 3
        run: |
          set -euo pipefail
          scad-project release-publish-branches \
            --version "${RELEASE_VERSION}" \
            --source-sha "${RELEASE_SOURCE_SHA}"

      - name: Create annotated release tag
        id: create-tag
        timeout-minutes: 2
        run: |
          set -euo pipefail
          git tag -a "${RELEASE_VERSION}" "${RELEASE_SOURCE_SHA}" \
            -m "${GITHUB_REPOSITORY} ${RELEASE_VERSION}"
          git push origin "refs/tags/${RELEASE_VERSION}"

      - name: Create GitHub Release and upload assets
        id: github-release
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_VERSION}" \
            --verify-tag \
            --title "${RELEASE_VERSION}" \
            --notes-file .release/RELEASE_NOTES.md \
            .release/*.zip \
            .release/SHA256SUMS.txt

      - name: Roll back incomplete release finalization
        if: ${{ failure() && steps.publish-branches.outcome == 'success' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_BRANCH: ${{ steps.preflight.outputs.build_branch }}
          VERIFICATION_BRANCH: ${{ steps.preflight.outputs.verification_branch }}
        run: |
          set +e
          gh release delete "${RELEASE_VERSION}" --yes >/dev/null 2>&1
          git push origin --delete "${RELEASE_VERSION}" >/dev/null 2>&1
          git push origin --delete "${BUILD_BRANCH}" >/dev/null 2>&1
          git push origin --delete "${VERIFICATION_BRANCH}" >/dev/null 2>&1
          echo "Rolled back any refs created by the incomplete release finalization."
