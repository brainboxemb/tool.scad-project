name: Temporary cache input patch

on:
  push:
    branches:
      - fix/layout-independent-cache-inputs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generalize cache input globs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/project-build.yml'),
              Path('.github/workflows/project-verify.yml'),
              Path('tests/test_cache_workflows.py'),
          ]
          replacements = {
              'dsg/**/*.scad': '**/*.scad',
              'dsg/**/*.py': '**/*.py',
              'dsg/**/render.yml': '**/render.yml',
              'dsg/**/export.yml': '**/export.yml',
              'dsg/**/*.stl': '**/*.stl',
              'dsg/**/*.off': '**/*.off',
              'dsg/**/*.amf': '**/*.amf',
              'dsg/**/*.3mf': '**/*.3mf',
              'dsg/**/*.obj': '**/*.obj',
              'dsg/**/*.dxf': '**/*.dxf',
              'dsg/**/*.svg': '**/*.svg',
              'dsg/**/*.dat': '**/*.dat',
              'dsg/**/*.txt': '**/*.txt',
              'dsg/**/*.png': '**/*.png',
              'dsg/**/design/**': '**/design/**',
          }

          for path in paths:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'no cache patterns changed in {path}')
              path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_cache_workflows.py')
          text = test_path.read_text(encoding='utf-8')
          marker = 'def test_scons_cache_keys_track_profiles_and_common_import_assets():'
          regression = '''def test_cache_globs_are_layout_independent():\n    for workflow in (\n        Path(".github/workflows/project-build.yml"),\n        Path(".github/workflows/project-verify.yml"),\n    ):\n        text = workflow.read_text(encoding="utf-8")\n        assert "dsg/**" not in text, f"{workflow} hard-codes the dsg source layout"\n        assert "'**/*.scad'" in text\n\n\n'''
          if regression not in text:
              text = text.replace(marker, regression + marker)
              test_path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary patch workflow
        run: rm .github/workflows/tmp-generalize-cache-inputs.yml
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/project-build.yml .github/workflows/project-verify.yml tests/test_cache_workflows.py .github/workflows/tmp-generalize-cache-inputs.yml
          git commit -m 'fix: make cache inputs layout independent'
          git push
