name: Reusable SCAD project verification

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded verification artifact
        required: false
        type: string
        default: scad-project-verification
      publish:
        description: Publish the generated verification branch
        required: false
        type: boolean
        default: true
      verification_path:
        description: Path containing generated verification evidence
        required: false
        type: string
        default: vrf/out
      source_ref:
        description: Optional exact branch, tag or commit to check out
        required: false
        type: string
        default: ''
      release_version:
        description: Optional coordinated release version for provenance
        required: false
        type: string
        default: ''
      source_sha:
        description: Optional exact source commit SHA for provenance
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.4.1

    env:
      SCAD_PROJECT_WORKFLOW_VERSION: v0.9.11
      SCAD_TOOLCHAIN_IMAGE: ghcr.io/brainboxemb/scad-toolchain:v0.4.1
      SCAD_TOOLCHAIN_VERSION: v0.4.1
      SCAD_PROJECT_RELEASE_VERSION: ${{ inputs.release_version }}
      SCAD_PROJECT_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SCAD_PROJECT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}

    steps:
      - name: Checkout project and pinned submodules
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Configure Git safe directories
        timeout-minutes: 2
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tools/tool.scad-project"

      - name: Describe selective build cache
        id: scons-cache
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          TOOL_SHA="$(git -C tools/tool.scad-project rev-parse HEAD)"
          SHORT_TOOL_SHA="${TOOL_SHA:0:12}"
          echo "tool_sha=${TOOL_SHA}" >> "$GITHUB_OUTPUT"
          echo "Selective build cache"
          echo "  Purpose   : reuse unchanged render/export build objects during verification"
          echo "  Repository: ${GITHUB_REPOSITORY}"
          echo "  Toolchain : ${SCAD_TOOLCHAIN_VERSION}"
          echo "  Tool       : ${SCAD_PROJECT_WORKFLOW_VERSION} (${SHORT_TOOL_SHA})"
          echo "  Mode       : Verify restores only; it never writes this cache"

      - name: Restore selective build cache
        id: selective-cache
        timeout-minutes: 2
        uses: actions/cache/restore@v4
        with:
          path: .cache/scad-project/scons
          key: scad-selective-build-v2-${{ runner.os }}-${{ github.repository_id }}-${{ env.SCAD_TOOLCHAIN_VERSION }}-${{ steps.scons-cache.outputs.tool_sha }}-${{ hashFiles('project.yml', '.gitmodules', '**/*.scad', '**/*.py', '**/render.yml', '**/export.yml', '**/*.stl', '**/*.off', '**/*.amf', '**/*.3mf', '**/*.obj', '**/*.dxf', '**/*.svg', '**/*.dat', '**/*.txt', '**/*.png', '**/design/**') }}
          restore-keys: |
            scad-selective-build-v2-${{ runner.os }}-${{ github.repository_id }}-${{ env.SCAD_TOOLCHAIN_VERSION }}-${{ steps.scons-cache.outputs.tool_sha }}-

      - name: Summarise cache status
        timeout-minutes: 2
        shell: bash
        env:
          SELECTIVE_HIT: ${{ steps.selective-cache.outputs.cache-hit }}
          SELECTIVE_MATCHED_KEY: ${{ steps.selective-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [[ "$SELECTIVE_HIT" == "true" ]]; then
            STATUS="exact hit"
          elif [[ -n "$SELECTIVE_MATCHED_KEY" ]]; then
            STATUS="fallback hit - selective reuse available"
          else
            STATUS="miss - verification runs without reusable build objects"
          fi

          echo "Selective build cache: ${STATUS}"
          echo "Verify cache mode: restore-only"
          {
            echo "## Cache status"
            echo ""
            echo "| Cache | What it is for | Result |"
            echo "| --- | --- | --- |"
            echo "| Selective build cache | Reuse unchanged render/export build objects | ${STATUS} |"
            echo ""
            echo "Verify is **restore-only**: it can consume this cache but never replaces the Build cache."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show toolchain
        timeout-minutes: 2
        run: scad-toolchain-info

      - name: Check tooling version alignment
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh tooling-check

      - name: Verify project source and configured builds
        timeout-minutes: 5
        run: bash ./tools/tool.scad-project/scad-project.sh verify

      - name: Run project functional verification
        timeout-minutes: 5
        run: bash ./tools/tool.scad-project/scad-project.sh functional-verify

      - name: Record publication provenance
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh publication-info-verification

      - name: Upload verification evidence
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.verification_path }}

      - name: Publish verification branch
        timeout-minutes: 2
        if: inputs.publish && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials
          bash ./tools/tool.scad-project/scad-project.sh publish-verification
