name: Reusable SCAD project verification

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded verification artifact
        required: false
        type: string
        default: scad-project-verification
      publish:
        description: Publish the generated verification branch
        required: false
        type: boolean
        default: true
      verification_path:
        description: Path containing generated verification evidence
        required: false
        type: string
        default: vrf/out

permissions:
  contents: write
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.4.1

    env:
      SCAD_PROJECT_WORKFLOW_VERSION: v0.7.3
      SCAD_TOOLCHAIN_IMAGE: ghcr.io/brainboxemb/scad-toolchain:v0.4.1
      SCAD_TOOLCHAIN_VERSION: v0.4.1

    steps:
      - name: Checkout project and pinned submodules
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure Git safe directories
        timeout-minutes: 2
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tools/tool.scad-project"

      - name: Resolve SCons cache namespace
        id: scons-cache
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          TOOL_SHA="$(git -C tools/tool.scad-project rev-parse HEAD)"
          echo "tool_sha=${TOOL_SHA}" >> "$GITHUB_OUTPUT"
          echo "SCons cache namespace: toolchain=${SCAD_TOOLCHAIN_VERSION}, tool=${TOOL_SHA}"

      - name: Restore SCons build cache
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: .cache/scad-project/scons
          key: scad-project-scons-v1-${{ runner.os }}-${{ github.repository_id }}-${{ env.SCAD_TOOLCHAIN_VERSION }}-${{ steps.scons-cache.outputs.tool_sha }}-${{ hashFiles('project.yml', '.gitmodules', 'dsg/**/*.scad', 'dsg/**/*.py') }}
          restore-keys: |
            scad-project-scons-v1-${{ runner.os }}-${{ github.repository_id }}-${{ env.SCAD_TOOLCHAIN_VERSION }}-${{ steps.scons-cache.outputs.tool_sha }}-

      - name: Show toolchain
        timeout-minutes: 2
        run: scad-toolchain-info

      - name: Check tooling version alignment
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh tooling-check

      - name: Verify project source and configured builds
        timeout-minutes: 5
        run: bash ./tools/tool.scad-project/scad-project.sh verify

      - name: Run project functional verification
        timeout-minutes: 5
        run: bash ./tools/tool.scad-project/scad-project.sh functional-verify

      - name: Record publication provenance
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh publication-info-verification

      - name: Upload verification evidence
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.verification_path }}

      - name: Publish verification branch
        timeout-minutes: 2
        if: inputs.publish && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials
          bash ./tools/tool.scad-project/scad-project.sh publish-verification
