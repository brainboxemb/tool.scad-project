name: Reusable SCAD project verification

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded verification artifact
        required: false
        type: string
        default: scad-project-verification
      publish:
        description: Publish the generated verification branch
        required: false
        type: boolean
        default: true
      verification_path:
        description: Path containing generated verification evidence
        required: false
        type: string
        default: vrf/out
      source_ref:
        description: Optional exact branch, tag or commit to check out
        required: false
        type: string
        default: ''
      release_version:
        description: Optional coordinated release version for provenance
        required: false
        type: string
        default: ''
      source_sha:
        description: Optional exact source commit SHA for provenance
        required: false
        type: string
        default: ''
      runtime_image:
        description: Qualified SCAD runtime image selected from project configuration
        required: false
        type: string
        default: ghcr.io/brainboxemb/scad-toolchain:v0.5.1
      use_verification_scons_cache:
        description: Restore/save Verification SCons objects only when verification render/export targets exist
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ inputs.runtime_image }}

    env:
      SCAD_PROJECT_WORKFLOW_VERSION: v0.14.11
      SCAD_TOOLCHAIN_IMAGE: ${{ inputs.runtime_image }}
      SCAD_TOOLCHAIN_VERSION: v0.5.1
      SCAD_PROJECT_RELEASE_VERSION: ${{ inputs.release_version }}
      SCAD_PROJECT_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SCAD_PROJECT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout project and pinned submodules
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Configure Git safe directories
        timeout-minutes: 2
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tools/tool.scad-project"

      - name: Describe verification cache
        id: scons-cache
        timeout-minutes: 2
        shell: bash
        env:
          USE_VERIFICATION_SCONS_CACHE: ${{ inputs.use_verification_scons_cache }}
        run: |
          set -euo pipefail
          TOOL_SHA="$(git -C tools/tool.scad-project rev-parse HEAD)"
          SHORT_TOOL_SHA="${TOOL_SHA:0:12}"
          echo "tool_sha=${TOOL_SHA}" >> "$GITHUB_OUTPUT"
          echo "SCAD_PROJECT_TOOL_SHA=${TOOL_SHA}" >> "$GITHUB_ENV"
          echo "Selective verification cache"
          echo "  Purpose   : reuse unchanged verification-only render/export objects per dependency"
          echo "  Repository: ${GITHUB_REPOSITORY}"
          echo "  Toolchain : ${SCAD_TOOLCHAIN_VERSION}"
          echo "  Tool       : ${SCAD_PROJECT_WORKFLOW_VERSION} (${SHORT_TOOL_SHA})"
          echo "  Enabled    : ${USE_VERIFICATION_SCONS_CACHE}"

      - name: Restore selective verification cache
        id: verification-cache
        if: inputs.use_verification_scons_cache
        timeout-minutes: 2
        uses: actions/cache/restore@v4
        with:
          path: .cache/scad-project/verification-scons
          key: scad-verification-v1-${{ runner.os }}-${{ github.repository_id }}-${{ env.SCAD_TOOLCHAIN_VERSION }}-${{ steps.scons-cache.outputs.tool_sha }}-${{ hashFiles('project.yml', 'project.scad.yml', '.gitmodules', '**/*.scad', '**/*.py', '**/render.yml', '**/export.yml', '**/*.stl', '**/*.off', '**/*.amf', '**/*.3mf', '**/*.obj', '**/*.dxf', '**/*.svg', '**/*.dat', '**/*.txt', '**/*.png') }}
          restore-keys: |
            scad-verification-v1-${{ runner.os }}-${{ github.repository_id }}-${{ env.SCAD_TOOLCHAIN_VERSION }}-${{ steps.scons-cache.outputs.tool_sha }}-

      - name: Summarise verification cache status
        timeout-minutes: 2
        shell: bash
        env:
          VERIFICATION_ENABLED: ${{ inputs.use_verification_scons_cache }}
          VERIFICATION_HIT: ${{ steps.verification-cache.outputs.cache-hit }}
          VERIFICATION_PRIMARY_KEY: ${{ steps.verification-cache.outputs.cache-primary-key }}
          VERIFICATION_MATCHED_KEY: ${{ steps.verification-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail

          if [[ "$VERIFICATION_ENABLED" != true ]]; then
            VERIFICATION_STATUS="disabled by project configuration"
            echo "SCAD_PROJECT_CACHE_NAMESPACE=disabled" >> "$GITHUB_ENV"
            echo "SCAD_PROJECT_CACHE_PRIMARY_KEY=" >> "$GITHUB_ENV"
            echo "SCAD_PROJECT_CACHE_MATCHED_KEY=" >> "$GITHUB_ENV"
            echo "SCAD_PROJECT_CACHE_HIT=false" >> "$GITHUB_ENV"
          elif [[ "$VERIFICATION_HIT" == "true" ]]; then
            VERIFICATION_STATUS="exact hit"
          elif [[ -n "$VERIFICATION_MATCHED_KEY" ]]; then
            VERIFICATION_STATUS="fallback hit - selective reuse available"
          else
            VERIFICATION_STATUS="miss - cold cache"
          fi

          if [[ "$VERIFICATION_ENABLED" == true ]]; then
            echo "SCAD_PROJECT_CACHE_NAMESPACE=scad-verification-v1" >> "$GITHUB_ENV"
            echo "SCAD_PROJECT_CACHE_PRIMARY_KEY=${VERIFICATION_PRIMARY_KEY}" >> "$GITHUB_ENV"
            echo "SCAD_PROJECT_CACHE_MATCHED_KEY=${VERIFICATION_MATCHED_KEY}" >> "$GITHUB_ENV"
            echo "SCAD_PROJECT_CACHE_HIT=${VERIFICATION_HIT}" >> "$GITHUB_ENV"
          fi

          echo "Selective verification cache: ${VERIFICATION_STATUS}"
          {
            echo "## Cache status"
            echo ""
            echo "| Cache | What it is for | Result |"
            echo "| --- | --- | --- |"
            echo "| Selective verification cache | Reuse unchanged verification-only objects per dependency | ${VERIFICATION_STATUS} |"
            echo ""
            echo "Verify does not restore or materialize the normal Build cache."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show toolchain
        timeout-minutes: 2
        run: scad-toolchain-info

      - name: Check tooling version alignment
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh tooling-check

      - name: Verify project
        timeout-minutes: 5
        run: bash ./tools/tool.scad-project/scad-project.sh verify

      - name: Summarise selective verification result
        timeout-minutes: 2
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(".cache/scad-project/verification-state/last-verification-build.json")
          if not report.is_file():
              raise SystemExit(0)
          data = json.loads(report.read_text(encoding="utf-8"))
          counts = data.get("outcome_counts", {})
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("\n## Verification target outcomes\n\n")
              handle.write("| Work | BUILT | CACHE_RESTORED | CURRENT | ERROR |\n")
              handle.write("| --- | ---: | ---: | ---: | ---: |\n")
              handle.write(
                  "| Verification targets | "
                  f"{counts.get('BUILT', 0)} | "
                  f"{counts.get('CACHE_RESTORED', 0)} | "
                  f"{counts.get('CURRENT', 0)} | "
                  f"{counts.get('ERROR', 0)} |\n"
              )
          PY

      - name: Save selective verification cache
        if: inputs.use_verification_scons_cache && steps.verification-cache.outputs.cache-hit != 'true' && hashFiles('.cache/scad-project/verification-scons/**') != ''
        timeout-minutes: 2
        uses: actions/cache/save@v4
        with:
          path: .cache/scad-project/verification-scons
          key: ${{ steps.verification-cache.outputs.cache-primary-key }}

      - name: Upload SCons verification report
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-scons-report
          path: .cache/scad-project/verification-state/last-verification-build.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Record publication provenance
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh publication-info-verification

      - name: Upload verification evidence
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.verification_path }}

      - name: Publish verification branch
        timeout-minutes: 2
        if: inputs.publish && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials
          bash ./tools/tool.scad-project/scad-project.sh publish-verification
