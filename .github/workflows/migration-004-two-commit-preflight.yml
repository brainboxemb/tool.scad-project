name: Migration 004 two-commit preflight proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-commit-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEMPLATE_HEAD: 082b0cecb47ba082899214751080adc54556e94c
      TEMPLATE_BASE: 8c25d1d326354cad82be0932df311acb3320df43
      OMITTED_INTERMEDIATE: 1e090239a5209b0abcfcbce5f7cc698b2f32351d

    steps:
      - name: Checkout exact template head only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: brainboxemb/template.scad-project
          ref: ${{ env.TEMPLATE_HEAD }}
          path: fixture
          fetch-depth: 1
          filter: blob:none

      - name: Fetch exact base commit only
        shell: bash
        run: |
          set -euo pipefail
          git -C fixture fetch --no-tags --depth=1 origin "${TEMPLATE_BASE}"
          git -C fixture rev-parse --verify "${TEMPLATE_HEAD}^{commit}"
          git -C fixture rev-parse --verify "${TEMPLATE_BASE}^{commit}"

          test "$(git -C fixture rev-list --count "$TEMPLATE_HEAD")" = 1
          test "$(git -C fixture rev-list --count "$TEMPLATE_BASE")" = 1
          if git -C fixture rev-list "$TEMPLATE_HEAD" | grep -Fxq "$OMITTED_INTERMEDIATE"; then
            echo "ERROR: deeper intermediate history is traversable from head" >&2
            exit 1
          fi

          echo "Head and base are both shallow history roots; intervening history is not traversable."

      - name: Query released Moon affected preflight
        id: affected
        uses: brainboxemb/tool.git-project/moon/affected@ce7c81c39ebc70933b4150028aa74d928a53c2ba
        with:
          task: consumer:scad.ci
          base: ${{ env.TEMPLATE_BASE }}
          head: ${{ env.TEMPLATE_HEAD }}
          working-directory: fixture
          evidence-directory: .moon/preflight-two-commit

      - name: Assert successful non-conservative result
        shell: bash
        env:
          AFFECTED: ${{ steps.affected.outputs.affected }}
        run: |
          set -euo pipefail
          test "$AFFECTED" = true
          python3 - <<'PY'
          import json
          from pathlib import Path

          decision = json.loads(Path("fixture/.moon/preflight-two-commit/decision.json").read_text(encoding="utf-8"))
          assert decision["status"] == "success", decision
          assert decision["reason"] == "task-affected", decision
          assert decision["affected"] is True, decision
          assert decision["moon_version"].startswith("moon 2.5.4"), decision
          print(json.dumps(decision, indent=2))
          PY

      - name: Upload proof evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-004-two-commit-preflight
          path: fixture/.moon/preflight-two-commit
          if-no-files-found: error
          retention-days: 14
