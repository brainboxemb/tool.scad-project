name: Temporary v0.9.10 release metadata

on:
  push:
    branches:
      - chore/release-v0.9.10

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          text = text.replace('version = "0.9.9"', 'version = "0.9.10"', 1)
          pyproject.write_text(text, encoding='utf-8')

          init = Path('src/scad_project/__init__.py')
          text = init.read_text(encoding='utf-8')
          text = text.replace('__version__ = "0.9.9"', '__version__ = "0.9.10"', 1)
          init.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## v0.9.9\n'
          entry = '''## v0.9.10\n\n### Fixed\n\n- Make Build and Verify cache-input hashing independent of the consumer repository layout instead of assuming CAD/design sources live under `dsg/`.\n- Track repository-wide OpenSCAD, Python, render/export profile, design metadata and common imported-asset inputs so layouts such as `lib.scad.hub75` invalidate stale generated-design snapshots correctly.\n- Add regression coverage that rejects a return to hard-coded `dsg/**` cache patterns.\n\n'''
          if marker not in text:
              raise SystemExit('v0.9.9 changelog marker not found')
          changelog.write_text(text.replace(marker, entry + marker, 1), encoding='utf-8')
          PY
      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml src/scad_project/__init__.py CHANGELOG.md
          git commit -m 'release: prepare v0.9.10 metadata'
          git push
