name: One-shot release tag v0.5.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v0.5.0 tag on release commit
        env:
          RELEASE_SHA: b9ad387319b3aaa1640325dacf79f08be8b04290
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v0.5.0 >/dev/null; then
            echo "v0.5.0 already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.5.0 "$RELEASE_SHA" -m "tool.scad-project v0.5.0"
          git push origin refs/tags/v0.5.0
