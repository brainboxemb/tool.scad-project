name: Prepare v0.14.8 release

on:
  push:
    branches:
      - feature/release-v0.14.8

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Add temporary v0.14.8 release-prep helper'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: feature/release-v0.14.8
          fetch-depth: 0

      - name: Prepare v0.14.8 metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'pyproject.toml': [('version = "0.14.7"', 'version = "0.14.8"')],
              'src/scad_project/__init__.py': [('__version__ = "0.14.7"', '__version__ = "0.14.8"')],
              '.github/workflows/project-build.yml': [('SCAD_PROJECT_WORKFLOW_VERSION: v0.14.7', 'SCAD_PROJECT_WORKFLOW_VERSION: v0.14.8')],
              '.github/workflows/project-verify.yml': [('SCAD_PROJECT_WORKFLOW_VERSION: v0.14.7', 'SCAD_PROJECT_WORKFLOW_VERSION: v0.14.8')],
              '.github/workflows/project-production.yml': [('SCAD_PROJECT_WORKFLOW_VERSION: v0.14.7', 'SCAD_PROJECT_WORKFLOW_VERSION: v0.14.8')],
              '.github/workflows/project-pr-cleanup.yml': [('SCAD_PROJECT_WORKFLOW_VERSION: v0.14.7', 'SCAD_PROJECT_WORKFLOW_VERSION: v0.14.8')],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{filename}: expected exactly one {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = 'Functional changes to released `tool.scad-project` versions.\n\n'
          section = '''## v0.14.8\n\n### Fixed\n\n- Publish `tool.scad-project` semantic release tags as lightweight refs that point directly at the already-qualified release commit, allowing nested reusable workflows to resolve through cross-repository `@vX.Y.Z` calls.\n- Add regression coverage for the lightweight release-tag contract exposed by final Migration-005 template release qualification.\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('CHANGELOG.md: release insertion anchor not unique')
          if '## v0.14.8' in text:
              raise SystemExit('CHANGELOG.md: v0.14.8 already present')
          changelog.write_text(text.replace(anchor, anchor + section, 1), encoding='utf-8')
          PY

          rm .github/workflows/prepare-v0148.yml

      - name: Commit release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare v0.14.8 release"
          git push origin HEAD:feature/release-v0.14.8
