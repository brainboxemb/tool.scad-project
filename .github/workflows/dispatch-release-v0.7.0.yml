name: Dispatch v0.7.0 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-release-v0.7.0.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch permanent release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -f ref="main" \
            -f inputs[version]="v0.7.0" \
            -f inputs[release_sha]="d535505ec07edd96b3b7139422f59716688c6225"
