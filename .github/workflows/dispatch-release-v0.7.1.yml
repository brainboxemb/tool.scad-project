name: Dispatch v0.7.1 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-release-v0.7.1.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch permanent release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -f ref="main" \
            -f inputs[version]="v0.7.1" \
            -f inputs[release_sha]="d77dced6fc63766eb5189ca812b2f860cd3dd369"
