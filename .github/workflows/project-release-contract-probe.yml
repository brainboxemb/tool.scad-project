name: Reusable SCAD release contract probe

on:
  workflow_call:

permissions:
  actions: read
  contents: write
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - run: echo "cross-repository release probe compiled"

  nested-build:
    if: ${{ false }}
    needs: resolve
    uses: $/.github/workflows/project-build.yml
    with:
      publish: false
