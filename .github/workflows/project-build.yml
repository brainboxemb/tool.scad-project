name: Reusable SCAD project build

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded build artifact
        required: false
        type: string
        default: scad-project-build
      publish:
        description: Publish the generated build branch
        required: false
        type: boolean
        default: true
      source_ref:
        description: Optional exact branch, tag or commit to check out
        required: false
        type: string
        default: ''
      release_version:
        description: Optional coordinated release version for provenance
        required: false
        type: string
        default: ''
      source_sha:
        description: Optional exact source commit SHA for provenance
        required: false
        type: string
        default: ''
      runtime_image:
        description: Qualified SCAD runtime image selected from project configuration
        required: false
        type: string
        default: ghcr.io/brainboxemb/scad-toolchain:v0.5.0
      use_scons_cache:
        description: Restore/save the normal SCons cache for projects using the SCons build engine
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ inputs.runtime_image }}

    env:
      SCAD_PROJECT_WORKFLOW_VERSION: v0.14.4
      SCAD_TOOLCHAIN_IMAGE: ${{ inputs.runtime_image }}
      SCAD_TOOLCHAIN_VERSION: v0.5.0
      SCAD_PROJECT_RELEASE_VERSION: ${{ inputs.release_version }}
      SCAD_PROJECT_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SCAD_PROJECT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout project and pinned submodules
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Configure Git safe directories
        timeout-minutes: 2
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tools/tool.scad-project"

      - name: Describe build caches
        id: scons-cache
        timeout-minutes: 2
        shell: bash
        env:
          USE_SCONS_CACHE: ${{ inputs.use_scons_cache }}
        run: |
          set -euo pipefail
          TOOL_SHA="$(git -C tools/tool.scad-project rev-parse HEAD)"
          SHORT_TOOL_SHA="${TOOL_SHA:0:12}"
          echo "tool_sha=${TOOL_SHA}" >> "$GITHUB_OUTPUT"
          echo "SCAD_PROJECT_TOOL_SHA=${TOOL_SHA}" >> "$GITHUB_ENV"
          echo "Selective build cache"
          echo "  Purpose   : reuse unchanged design images, renders and exports per dependency"
          echo "  Repository: ${GITHUB_REPOSITORY}"
          echo "  Toolchain : ${SCAD_TOOLCHAIN_VERSION}"
          echo "  Tool       : ${SCAD_PROJECT_WORKFLOW_VERSION} (${SHORT_TOOL_SHA})"
          echo "  Enabled    : ${USE_SCONS_CACHE}"
          echo "Generated design snapshot"
          echo "  Purpose   : reuse the complete bld/design tree when all design inputs are identical"

      - name: Restore selective build cache
        id: selective-cache
        if: inputs.use_scons_cache
        timeout-minutes: 2
        uses: actions/cache/restore@v4
        with:
          path: .cache/scad-project/scons
          key: scad-selective-build-v2-${{ runner.os }}-${{ github.repository_id }}-${{ env.SCAD_TOOLCHAIN_VERSION }}-${{ steps.scons-cache.outputs.tool_sha }}-${{ hashFiles('project.yml', 'project.scad.yml', '.gitmodules', '**/*.scad', '**/*.py', '**/render.yml', '**/export.yml', '**/*.stl', '**/*.off', '**/*.amf', '**/*.3mf', '**/*.obj', '**/*.dxf', '**/*.svg', '**/*.dat', '**/*.txt', '**/*.png', '**/design/**') }}
          restore-keys: |
            scad-selective-build-v2-${{ runner.os }}-${{ github.repository_id }}-${{ env.SCAD_TOOLCHAIN_VERSION }}-${{ steps.scons-cache.outputs.tool_sha }}-

      - name: Show toolchain
        timeout-minutes: 2
        run: scad-toolchain-info

      - name: Check tooling version alignment
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh tooling-check

      - name: Lint project configuration
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh config-lint

      - name: Check external dependencies
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh externals-check

      - name: Lint OpenSCAD source documentation
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh docs-lint

      - name: Lint design documentation
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh design-lint

      - name: Restore exact generated design snapshot
        id: design-cache
        timeout-minutes: 2
        uses: actions/cache/restore@v4
        with:
          path: bld/design
          key: scad-design-snapshot-v2-${{ runner.os }}-${{ github.repository_id }}-${{ env.SCAD_TOOLCHAIN_VERSION }}-${{ steps.scons-cache.outputs.tool_sha }}-${{ hashFiles('project.yml', 'project.scad.yml', '.gitmodules', '**/*.scad', '**/*.py', '**/render.yml', '**/export.yml', '**/*.stl', '**/*.off', '**/*.amf', '**/*.3mf', '**/*.obj', '**/*.dxf', '**/*.svg', '**/*.dat', '**/*.txt', '**/*.png', '**/design/**') }}

      - name: Summarise cache status
        timeout-minutes: 2
        shell: bash
        env:
          SELECTIVE_ENABLED: ${{ inputs.use_scons_cache }}
          SELECTIVE_HIT: ${{ steps.selective-cache.outputs.cache-hit }}
          SELECTIVE_PRIMARY_KEY: ${{ steps.selective-cache.outputs.cache-primary-key }}
          SELECTIVE_MATCHED_KEY: ${{ steps.selective-cache.outputs.cache-matched-key }}
          DESIGN_HIT: ${{ steps.design-cache.outputs.cache-hit }}
          DESIGN_MATCHED_KEY: ${{ steps.design-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail

          cache_status() {
            local hit="$1"
            local matched="$2"
            if [[ "$hit" == "true" ]]; then
              echo "exact hit"
            elif [[ -n "$matched" ]]; then
              echo "fallback hit - selective reuse available"
            else
              echo "miss - cold cache"
            fi
          }

          if [[ "$SELECTIVE_ENABLED" == true ]]; then
            SELECTIVE_STATUS="$(cache_status "$SELECTIVE_HIT" "$SELECTIVE_MATCHED_KEY")"
            echo "SCAD_PROJECT_CACHE_NAMESPACE=scad-selective-build-v2" >> "$GITHUB_ENV"
            echo "SCAD_PROJECT_CACHE_PRIMARY_KEY=${SELECTIVE_PRIMARY_KEY}" >> "$GITHUB_ENV"
            echo "SCAD_PROJECT_CACHE_MATCHED_KEY=${SELECTIVE_MATCHED_KEY}" >> "$GITHUB_ENV"
            echo "SCAD_PROJECT_CACHE_HIT=${SELECTIVE_HIT}" >> "$GITHUB_ENV"
          else
            SELECTIVE_STATUS="disabled by project configuration"
            echo "SCAD_PROJECT_CACHE_NAMESPACE=disabled" >> "$GITHUB_ENV"
            echo "SCAD_PROJECT_CACHE_PRIMARY_KEY=" >> "$GITHUB_ENV"
            echo "SCAD_PROJECT_CACHE_MATCHED_KEY=" >> "$GITHUB_ENV"
            echo "SCAD_PROJECT_CACHE_HIT=false" >> "$GITHUB_ENV"
          fi
          DESIGN_STATUS="$(cache_status "$DESIGN_HIT" "$DESIGN_MATCHED_KEY")"

          echo "Selective build cache: ${SELECTIVE_STATUS}"
          echo "Generated design snapshot: ${DESIGN_STATUS}"

          {
            echo "## Cache status"
            echo ""
            echo "| Cache | What it is for | Result |"
            echo "| --- | --- | --- |"
            echo "| Selective build cache | Reuse unchanged design images, renders and exports per dependency | ${SELECTIVE_STATUS} |"
            echo "| Generated design snapshot | Skip the whole design build when all design inputs are identical | ${DESIGN_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate design documentation
        if: steps.design-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: bash ./tools/tool.scad-project/scad-project.sh design-build

      - name: Report restored design documentation
        if: steps.design-cache.outputs.cache-hit == 'true'
        timeout-minutes: 2
        run: echo "Exact generated design snapshot restored; design-build skipped."

      - name: Build configured outputs
        timeout-minutes: 5
        run: bash ./tools/tool.scad-project/scad-project.sh build

      - name: Summarise selective rebuild result
        timeout-minutes: 2
        if: always()
        shell: bash
        env:
          DESIGN_CACHE_HIT: ${{ steps.design-cache.outputs.cache-hit }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          rows = []

          def outcomes(path):
              data = json.loads(path.read_text(encoding="utf-8"))
              counts = data.get("outcome_counts", {})
              return [str(counts.get(name, 0)) for name in ("BUILT", "CACHE_RESTORED", "CURRENT", "ERROR")]

          design_report = Path(".cache/scad-project/state/last-design-build.json")
          if os.environ.get("DESIGN_CACHE_HIT") == "true":
              rows.append(("Design images", "0", "0", "0", "0", "exact design snapshot restored; design SCons skipped"))
          elif design_report.is_file():
              rows.append(("Design images", *outcomes(design_report), ""))
          else:
              rows.append(("Design images", "n/a", "n/a", "n/a", "n/a", "no report"))

          build_report = Path(".cache/scad-project/state/last-build.json")
          if build_report.is_file():
              rows.append(("Configured outputs", *outcomes(build_report), ""))
          else:
              rows.append(("Configured outputs", "n/a", "n/a", "n/a", "n/a", "no report"))

          with summary.open("a", encoding="utf-8") as handle:
              handle.write("\n## Build decision outcomes\n\n")
              handle.write("| Work | BUILT | CACHE_RESTORED | CURRENT | ERROR | Note |\n")
              handle.write("| --- | ---: | ---: | ---: | ---: | --- |\n")
              for row in rows:
                  handle.write("| " + " | ".join(row) + " |\n")
          PY

      - name: Save exact generated design snapshot
        if: steps.design-cache.outputs.cache-hit != 'true'
        timeout-minutes: 2
        uses: actions/cache/save@v4
        with:
          path: bld/design
          key: ${{ steps.design-cache.outputs.cache-primary-key }}

      - name: Save selective build cache
        if: inputs.use_scons_cache && steps.selective-cache.outputs.cache-hit != 'true' && hashFiles('.cache/scad-project/scons/**') != ''
        timeout-minutes: 2
        uses: actions/cache/save@v4
        with:
          path: .cache/scad-project/scons
          key: ${{ steps.selective-cache.outputs.cache-primary-key }}

      - name: Upload SCons build reports
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-scons-report
          path: |
            .cache/scad-project/state/last-build.json
            .cache/scad-project/state/last-design-build.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate build index
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh build-index

      - name: Record publication provenance
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh publication-info-build

      - name: Upload generated build
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: bld

      - name: Publish generated build branch
        timeout-minutes: 2
        if: inputs.publish && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials
          bash ./tools/tool.scad-project/scad-project.sh publish-build
