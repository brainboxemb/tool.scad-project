name: Reusable SCAD project build

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded build artifact
        required: false
        type: string
        default: scad-project-build
      publish:
        description: Publish the generated build branch
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.3.0

    env:
      SCAD_PROJECT_WORKFLOW_VERSION: v0.4.1

    steps:
      - name: Checkout project and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain
        run: scad-toolchain-info

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check tooling version alignment
        run: bash ./tools/tool.scad-project/scad-project.sh tooling-check

      - name: Lint project configuration
        run: bash ./tools/tool.scad-project/scad-project.sh config-lint

      - name: Check external dependencies
        run: bash ./tools/tool.scad-project/scad-project.sh externals-check

      - name: Lint OpenSCAD source documentation
        run: bash ./tools/tool.scad-project/scad-project.sh docs-lint

      - name: Lint design documentation
        run: bash ./tools/tool.scad-project/scad-project.sh design-lint

      - name: Generate design documentation
        run: bash ./tools/tool.scad-project/scad-project.sh design-build

      - name: Build configured outputs
        run: bash ./tools/tool.scad-project/scad-project.sh build

      - name: Generate build index
        run: bash ./tools/tool.scad-project/scad-project.sh build-index

      - name: Upload generated build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: bld

      - name: Publish generated build branch
        if: inputs.publish && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials
          bash ./tools/tool.scad-project/scad-project.sh publish-build
