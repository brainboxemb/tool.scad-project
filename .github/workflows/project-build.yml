name: Reusable SCAD project build

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Name of the uploaded build artifact
        required: false
        type: string
        default: scad-project-build
      publish:
        description: Publish the generated build branch
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.4.1

    env:
      SCAD_PROJECT_WORKFLOW_VERSION: v0.7.3
      SCAD_TOOLCHAIN_IMAGE: ghcr.io/brainboxemb/scad-toolchain:v0.4.1
      SCAD_TOOLCHAIN_VERSION: v0.4.1

    steps:
      - name: Checkout project and pinned submodules
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Configure Git safe directories
        timeout-minutes: 2
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tools/tool.scad-project"

      - name: Resolve SCons cache namespace
        id: scons-cache
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          TOOL_SHA="$(git -C tools/tool.scad-project rev-parse HEAD)"
          echo "tool_sha=${TOOL_SHA}" >> "$GITHUB_OUTPUT"
          echo "SCons cache namespace: toolchain=${SCAD_TOOLCHAIN_VERSION}, tool=${TOOL_SHA}"

      - name: Restore SCons build cache
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: .cache/scad-project/scons
          key: scad-project-scons-v1-${{ runner.os }}-${{ github.repository_id }}-${{ env.SCAD_TOOLCHAIN_VERSION }}-${{ steps.scons-cache.outputs.tool_sha }}-${{ hashFiles('project.yml', '.gitmodules', 'dsg/**/*.scad', 'dsg/**/*.py') }}
          restore-keys: |
            scad-project-scons-v1-${{ runner.os }}-${{ github.repository_id }}-${{ env.SCAD_TOOLCHAIN_VERSION }}-${{ steps.scons-cache.outputs.tool_sha }}-

      - name: Show toolchain
        timeout-minutes: 2
        run: scad-toolchain-info

      - name: Check tooling version alignment
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh tooling-check

      - name: Lint project configuration
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh config-lint

      - name: Check external dependencies
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh externals-check

      - name: Lint OpenSCAD source documentation
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh docs-lint

      - name: Lint design documentation
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh design-lint

      - name: Restore generated design documentation
        id: design-cache
        timeout-minutes: 2
        uses: actions/cache@v4
        with:
          path: bld/design
          key: scad-project-design-v1-${{ runner.os }}-${{ github.repository_id }}-${{ env.SCAD_TOOLCHAIN_VERSION }}-${{ steps.scons-cache.outputs.tool_sha }}-${{ hashFiles('project.yml', '.gitmodules', 'dsg/**/*.scad', 'dsg/**/*.py', 'dsg/**/design/**') }}

      - name: Generate design documentation
        if: steps.design-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: bash ./tools/tool.scad-project/scad-project.sh design-build

      - name: Report restored design documentation
        if: steps.design-cache.outputs.cache-hit == 'true'
        timeout-minutes: 2
        run: echo "Design documentation restored from cache; design-build skipped."

      - name: Build configured outputs
        timeout-minutes: 5
        run: bash ./tools/tool.scad-project/scad-project.sh build

      - name: Upload SCons build report
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-scons-report
          path: .cache/scad-project/state/last-build.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate build index
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh build-index

      - name: Record publication provenance
        timeout-minutes: 2
        run: bash ./tools/tool.scad-project/scad-project.sh publication-info-build

      - name: Upload generated build
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: bld

      - name: Publish generated build branch
        timeout-minutes: 2
        if: inputs.publish && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials
          bash ./tools/tool.scad-project/scad-project.sh publish-build
