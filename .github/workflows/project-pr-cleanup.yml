name: Reusable SCAD project PR cleanup

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number whose generated preview branches must be removed
        required: true
        type: number
      delete_source_branch:
        description: Delete the merged same-repository pull request source branch
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SCAD_PROJECT_WORKFLOW_VERSION: v0.9.11

    steps:
      - name: Checkout merged repository state and pinned tooling
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        timeout-minutes: 2
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned project tooling
        timeout-minutes: 2
        run: python -m pip install -e ./tools/tool.scad-project

      - name: Configure publication credentials
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global credential.helper store
          printf "https://x-access-token:%s@github.com\n" "$GITHUB_TOKEN" > ~/.git-credentials

      - name: Remove generated pull request publication branches
        timeout-minutes: 2
        run: scad-project publication-cleanup-pr --pr-number "${{ inputs.pr_number }}"

      - name: Delete merged source branch
        timeout-minutes: 2
        if: >-
          inputs.delete_source_branch &&
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref != github.event.pull_request.base.ref
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/${SOURCE_BRANCH}" >/dev/null 2>&1; then
            git push origin --delete "${SOURCE_BRANCH}"
          else
            echo "Source branch already absent: ${SOURCE_BRANCH}"
          fi
