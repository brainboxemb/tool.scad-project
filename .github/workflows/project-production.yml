name: Reusable SCAD production

on:
  workflow_call:
    inputs:
      aggregate_task:
        description: Fully-qualified Moon aggregate production task to execute when production is required
        required: false
        type: string
        default: consumer:scad.ci
      affected_task:
        description: Optional fully-qualified Moon task used only for the pre-container affected decision; defaults to aggregate_task
        required: false
        type: string
        default: ''
      cache_namespace:
        description: Stable repository-local Moon cache namespace
        required: false
        type: string
        default: scad-production-v1
      build_path:
        description: Generated Build tree to stage and publish
        required: false
        type: string
        default: bld
      verification_path:
        description: Generated Verification tree to stage and publish
        required: false
        type: string
        default: vrf/out
      build_artifact_name:
        description: Prepared Build publication artifact name
        required: false
        type: string
        default: scad-project-build-publication
      verification_artifact_name:
        description: Prepared Verification publication artifact name
        required: false
        type: string
        default: scad-project-verification-publication
      build_branch_suffix:
        description: Generated-output branch suffix for Build publication
        required: false
        type: string
        default: build
      verification_branch_suffix:
        description: Generated-output branch suffix for Verification publication
        required: false
        type: string
        default: verification
      publish:
        description: Publish prepared Build and Verification output
        required: false
        type: boolean
        default: true
      source_sha:
        description: Optional exact source commit SHA; normally inferred from the caller event
        required: false
        type: string
        default: ''
      base_sha:
        description: Optional exact comparison-base commit SHA; normally inferred from the caller event
        required: false
        type: string
        default: ''
      force:
        description: Force conservative production regardless of affected state
        required: false
        type: boolean
        default: false
    outputs:
      affected:
        description: Whether SCAD production ran or was required conservatively
        value: ${{ jobs.production.outputs.affected }}
      source_sha:
        description: Exact source revision assessed and, when affected, produced
        value: ${{ jobs.production.outputs.source_sha }}
      base_sha:
        description: Exact comparison base when available
        value: ${{ jobs.production.outputs.base_sha }}

permissions:
  contents: write
  packages: read

concurrency:
  group: scad-production-${{ github.repository_id }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: SCAD production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      affected: ${{ steps.affected.outputs.affected }}
      source_sha: ${{ steps.range.outputs.source_sha }}
      base_sha: ${{ steps.range.outputs.base_sha }}
    env:
      SCAD_PROJECT_WORKFLOW_VERSION: v0.13.0
      SCAD_TOOLCHAIN_IMAGE: ghcr.io/brainboxemb/scad-toolchain:v0.4.1
      SCAD_TOOLCHAIN_VERSION: v0.4.1

    steps:
      - name: Resolve exact source, comparison base and affected task
        id: range
        shell: bash
        env:
          SOURCE_INPUT: ${{ inputs.source_sha }}
          BASE_INPUT: ${{ inputs.base_sha }}
          AFFECTED_INPUT: ${{ inputs.affected_task }}
          AGGREGATE_TASK: ${{ inputs.aggregate_task }}
          FORCE: ${{ inputs.force }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail

          source_sha="$SOURCE_INPUT"
          if [[ -z "$source_sha" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PR_HEAD_SHA" ]]; then
              source_sha="$PR_HEAD_SHA"
            else
              source_sha="$GITHUB_SHA"
            fi
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: source_sha must resolve to an exact 40-character commit SHA" >&2
            exit 1
          fi

          base_sha="$BASE_INPUT"
          if [[ "$FORCE" == "true" ]]; then
            base_sha="0000000000000000000000000000000000000000"
            echo "Force requested; preflight will deliberately fail conservative."
          elif [[ -z "$base_sha" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
              base_sha="$PR_BASE_SHA"
            elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" ]]; then
              base_sha="$PUSH_BEFORE_SHA"
            else
              base_sha="0000000000000000000000000000000000000000"
              echo "No unambiguous event base is available; preflight will fail conservative."
            fi
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid base_sha supplied; replacing it with a missing revision so production runs conservatively."
            base_sha="0000000000000000000000000000000000000000"
          fi

          affected_task="$AFFECTED_INPUT"
          if [[ -z "$affected_task" ]]; then
            affected_task="$AGGREGATE_TASK"
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "affected_task=$affected_task" >> "$GITHUB_OUTPUT"
          echo "SCAD preflight range: $base_sha -> $source_sha"
          echo "SCAD preflight target: $affected_task"

      - name: Checkout exact source for host orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.range.outputs.source_sha }}
          fetch-depth: 1
          filter: blob:none
          submodules: false
          persist-credentials: false

      - name: Fetch only the exact comparison base
        shell: bash
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "No concrete comparison base; generic Moon preflight will run conservatively."
          elif git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            git rev-parse --verify "${BASE_SHA}^{commit}"
            echo "Fetched exact comparison base as a shallow history root."
          else
            echo "Comparison base could not be fetched; generic Moon preflight will run conservatively."
          fi

      - name: Query released Moon affected preflight
        id: affected
        uses: brainboxemb/tool.git-project/moon/affected@v0.2.7
        with:
          task: ${{ steps.range.outputs.affected_task }}
          base: ${{ steps.range.outputs.base_sha }}
          head: ${{ steps.range.outputs.source_sha }}
          evidence-directory: .moon/preflight

      - name: Summarise preflight decision
        shell: bash
        env:
          AFFECTED: ${{ steps.affected.outputs.affected }}
        run: |
          set -euo pipefail
          cat .moon/preflight/decision.json
          {
            echo "## SCAD production preflight"
            echo ""
            echo "- source: \`${{ steps.range.outputs.source_sha }}\`"
            echo "- base: \`${{ steps.range.outputs.base_sha }}\`"
            echo "- affected task: \`${{ steps.range.outputs.affected_task }}\`"
            echo "- execution task: \`${{ inputs.aggregate_task }}\`"
            echo "- affected: \`$AFFECTED\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.build_artifact_name }}-preflight
          path: .moon/preflight
          if-no-files-found: error
          retention-days: 14

      - name: Resolve exact SCAD tool gitlink for caches
        id: tooling-ref
        if: steps.affected.outputs.affected == 'true'
        shell: bash
        run: |
          set -euo pipefail
          entry="$(git ls-tree HEAD -- tools/tool.scad-project)"
          read -r mode type sha path <<< "$entry"
          test "$mode" = 160000
          test "$type" = commit
          test "$path" = tools/tool.scad-project
          test "$sha" != ""
          echo "scad_tool_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "SCAD tool gitlink: $sha"

      - name: Restore portable Moon task cache
        if: steps.affected.outputs.affected == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .moon/cache/hashes
            .moon/cache/outputs
          key: tool-git-project-moon-2.5.4-${{ runner.os }}-${{ inputs.cache_namespace }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tool-git-project-moon-2.5.4-${{ runner.os }}-${{ inputs.cache_namespace }}-

      - name: Restore normal SCons object cache
        id: build-cache
        if: steps.affected.outputs.affected == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/scad-project/scons
          key: scad-production-build-scons-v1-${{ runner.os }}-${{ github.repository_id }}-v0.4.1-${{ steps.tooling-ref.outputs.scad_tool_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scad-production-build-scons-v1-${{ runner.os }}-${{ github.repository_id }}-v0.4.1-${{ steps.tooling-ref.outputs.scad_tool_sha }}-

      - name: Restore verification SCons object cache
        id: verification-cache
        if: steps.affected.outputs.affected == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/scad-project/verification-scons
          key: scad-production-verification-scons-v1-${{ runner.os }}-${{ github.repository_id }}-v0.4.1-${{ steps.tooling-ref.outputs.scad_tool_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scad-production-verification-scons-v1-${{ runner.os }}-${{ github.repository_id }}-v0.4.1-${{ steps.tooling-ref.outputs.scad_tool_sha }}-

      - name: Prepare exact Moon range for the SCAD container
        id: moon-range
        if: steps.affected.outputs.affected == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
          SOURCE_SHA: ${{ steps.range.outputs.source_sha }}
        run: |
          set -euo pipefail
          moon_force=false
          moon_base="$SOURCE_SHA"
          if [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] && git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            moon_base="$BASE_SHA"
            echo "Prepared exact shallow Moon production range: $BASE_SHA -> $SOURCE_SHA"
          else
            moon_force=true
            echo "No usable production comparison base; forcing Moon execution without affected VCS checks."
          fi
          echo "moon_force=$moon_force" >> "$GITHUB_OUTPUT"
          echo "moon_base=$moon_base" >> "$GITHUB_OUTPUT"
          echo "moon_head=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Pull exact SCAD toolchain image on host
        if: steps.affected.outputs.affected == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$SCAD_TOOLCHAIN_IMAGE"
          docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Run or hydrate aggregate SCAD production graph in one Docker process
        if: steps.affected.outputs.affected == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.range.outputs.source_sha }}
          MOON_BASE_VALUE: ${{ steps.moon-range.outputs.moon_base }}
          MOON_HEAD_VALUE: ${{ steps.moon-range.outputs.moon_head }}
          MOON_FORCE_VALUE: ${{ steps.moon-range.outputs.moon_force }}
          AGGREGATE_TASK: ${{ inputs.aggregate_task }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail

          moon_runtime="$RUNNER_TEMP/tool-git-project/moon-runtime"
          git_tool_action_root="$(realpath "$GITHUB_WORKSPACE/../../_actions/brainboxemb/tool.git-project/v0.2.7")"
          test -d "$moon_runtime"
          test -f "$git_tool_action_root/moon-project.sh"
          test "$(tr -d '\r\n' < "$git_tool_action_root/VERSION")" = 0.2.7

          docker_args=(
            --rm
            --user "$(id -u):$(id -g)"
            -e HOME=/tmp
            -e CI=true
            -e GITHUB_ACTIONS=true
            -e GITHUB_WORKSPACE=/work
            -e "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
            -e "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
            -e "GITHUB_REF=$GITHUB_REF"
            -e "GITHUB_REF_TYPE=$GITHUB_REF_TYPE"
            -e "GITHUB_REF_NAME=$SOURCE_REF"
            -e "GITHUB_HEAD_REF=${GITHUB_HEAD_REF:-}"
            -e "GITHUB_BASE_REF=${GITHUB_BASE_REF:-}"
            -e "GITHUB_SHA=$SOURCE_SHA"
            -e "GITHUB_RUN_ID=$GITHUB_RUN_ID"
            -e "GITHUB_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            -e "SCAD_PROJECT_PR_NUMBER=$PR_NUMBER"
            -e "SCAD_PROJECT_SOURCE_SHA=$SOURCE_SHA"
            -e "SCAD_PROJECT_WORKFLOW_VERSION=$SCAD_PROJECT_WORKFLOW_VERSION"
            -e "SCAD_TOOLCHAIN_IMAGE=$SCAD_TOOLCHAIN_IMAGE"
            -e "SCAD_TOOLCHAIN_VERSION=$SCAD_TOOLCHAIN_VERSION"
            -e "MOON_BASE=$MOON_BASE_VALUE"
            -e "MOON_HEAD=$MOON_HEAD_VALUE"
            -e MOON_INSTALL_ROOT=/moon-runtime
            -e "AGGREGATE_TASK=$AGGREGATE_TASK"
            -v "$GITHUB_WORKSPACE:/work"
            -v "$moon_runtime:/moon-runtime"
            -v "$git_tool_action_root:/tool-git-v027:ro"
            -w /work
          )
          if [[ "$MOON_FORCE_VALUE" == true ]]; then
            docker_args+=( -e MOON_FORCE=true )
          fi

          docker run "${docker_args[@]}" "$SCAD_TOOLCHAIN_IMAGE" bash -lc '
            set -euo pipefail
            git config --global --add safe.directory /work
            bash ./bootstrap.sh
            git config --global --add safe.directory /work/tools/tool.git-project
            git config --global --add safe.directory /work/tools/tool.scad-project
            tools/tool.git-project/git-project.sh validate --repo .
            bash ./tools/tool.scad-project/scad-project.sh tooling-check
            scad-toolchain-info
            printf "consumer tool.git-project gitlink: %s\n" "$(git -C tools/tool.git-project rev-parse HEAD)"
            printf "tool.scad-project gitlink: %s\n" "$(git -C tools/tool.scad-project rev-parse HEAD)"
            printf "repository orchestration release: %s\n" "$(tr -d "\r\n" < /tool-git-v027/VERSION)"
            bash /tool-git-v027/moon-project.sh run "$AGGREGATE_TASK" --repo . --install-root /moon-runtime
          '

      - name: Save normal SCons object cache
        if: always() && steps.affected.outputs.affected == 'true' && steps.build-cache.outputs.cache-hit != 'true' && hashFiles('.cache/scad-project/scons/**') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/scad-project/scons
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Save verification SCons object cache
        if: always() && steps.affected.outputs.affected == 'true' && steps.verification-cache.outputs.cache-hit != 'true' && hashFiles('.cache/scad-project/verification-scons/**') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/scad-project/verification-scons
          key: ${{ steps.verification-cache.outputs.cache-primary-key }}

      - name: Validate generic production materialization
        if: steps.affected.outputs.affected == 'true'
        shell: bash
        env:
          AGGREGATE_TASK: ${{ inputs.aggregate_task }}
          SOURCE_SHA: ${{ steps.range.outputs.source_sha }}
          BUILD_PATH: ${{ inputs.build_path }}
          VERIFICATION_PATH: ${{ inputs.verification_path }}
        run: |
          set -euo pipefail
          test -d "$BUILD_PATH"
          test -d "$VERIFICATION_PATH"
          find "$BUILD_PATH" -mindepth 1 -print -quit | grep -q .
          find "$VERIFICATION_PATH" -mindepth 1 -print -quit | grep -q .

          task_key="${AGGREGATE_TASK//:/_}"
          evidence_dir=".moon/invocations/${task_key}"
          test -s "$evidence_dir/moon.log"
          test -s "$evidence_dir/materialization.json"

          AGGREGATE_TASK="$AGGREGATE_TASK" SOURCE_SHA="$SOURCE_SHA" EVIDENCE_DIR="$evidence_dir" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["EVIDENCE_DIR"]) / "materialization.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "task": os.environ["AGGREGATE_TASK"],
              "source_revision": os.environ["SOURCE_SHA"],
              "status": "success",
              "exit_code": 0,
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f"{path}: {key} mismatch: {data.get(key)!r} != {value!r}")
          print(json.dumps(data, indent=2))
          PY

      - name: Stage publication trees with current orchestration evidence
        if: steps.affected.outputs.affected == 'true'
        shell: bash
        env:
          AGGREGATE_TASK: ${{ inputs.aggregate_task }}
          BUILD_PATH: ${{ inputs.build_path }}
          VERIFICATION_PATH: ${{ inputs.verification_path }}
        run: |
          set -euo pipefail
          task_key="${AGGREGATE_TASK//:/_}"
          evidence_dir=".moon/invocations/${task_key}"

          build_staging="$RUNNER_TEMP/scad-build-publication"
          verification_staging="$RUNNER_TEMP/scad-verification-publication"
          rm -rf "$build_staging" "$verification_staging"
          mkdir -p "$build_staging/orchestration" "$verification_staging/orchestration"

          cp -a "$BUILD_PATH"/. "$build_staging/"
          cp -a "$VERIFICATION_PATH"/. "$verification_staging/"
          for staging in "$build_staging" "$verification_staging"; do
            cp "$evidence_dir/moon.log" "$staging/orchestration/moon.log"
            cp "$evidence_dir/materialization.json" "$staging/orchestration/materialization.json"
          done

      - name: Upload prepared Build publication
        if: steps.affected.outputs.affected == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.build_artifact_name }}
          path: ${{ runner.temp }}/scad-build-publication
          if-no-files-found: error
          retention-days: 14

      - name: Upload prepared Verification publication
        if: steps.affected.outputs.affected == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.verification_artifact_name }}
          path: ${{ runner.temp }}/scad-verification-publication
          if-no-files-found: error
          retention-days: 14

      - name: Publish Build output from host
        if: inputs.publish && steps.affected.outputs.affected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: brainboxemb/tool.git-project/generated-output/publish@6234b7437b0dc0115642468f74d1f4a2c2214bef
        with:
          source-directory: ${{ runner.temp }}/scad-build-publication
          branch-suffix: ${{ inputs.build_branch_suffix }}
          source-revision: ${{ steps.range.outputs.source_sha }}
          token: ${{ github.token }}

      - name: Publish Verification output from host
        if: inputs.publish && steps.affected.outputs.affected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: brainboxemb/tool.git-project/generated-output/publish@6234b7437b0dc0115642468f74d1f4a2c2214bef
        with:
          source-directory: ${{ runner.temp }}/scad-verification-publication
          branch-suffix: ${{ inputs.verification_branch_suffix }}
          source-revision: ${{ steps.range.outputs.source_sha }}
          token: ${{ github.token }}
