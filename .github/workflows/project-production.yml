name: Reusable SCAD production

on:
  workflow_call:
    inputs:
      cache_namespace:
        description: Stable repository-local Moon cache namespace
        required: false
        type: string
        default: scad-production-v2
      evidence_artifact_name:
        description: Compact impact/materialization evidence artifact name
        required: false
        type: string
        default: scad-production-evidence
      build_branch_suffix:
        description: Generated-output branch suffix for Build publication
        required: false
        type: string
        default: build
      verification_branch_suffix:
        description: Generated-output branch suffix for Verification publication
        required: false
        type: string
        default: verification
      publish:
        description: Publish changed Build and Verification output families
        required: false
        type: boolean
        default: true
      source_sha:
        description: Optional exact source commit SHA; normally inferred from the caller event
        required: false
        type: string
        default: ''
      base_sha:
        description: Optional exact comparison-base commit SHA; normally inferred from the caller event
        required: false
        type: string
        default: ''
      force:
        description: Force conservative production regardless of affected state
        required: false
        type: boolean
        default: false
    outputs:
      affected:
        description: Whether SCAD capabilities required runtime materialization
        value: ${{ jobs.production.outputs.affected }}
      affected_capabilities:
        description: JSON list of source-affected SCAD capabilities
        value: ${{ jobs.production.outputs.affected_capabilities }}
      source_sha:
        description: Exact source revision assessed and, when affected, produced
        value: ${{ jobs.production.outputs.source_sha }}
      base_sha:
        description: Exact comparison base when available
        value: ${{ jobs.production.outputs.base_sha }}

permissions:
  contents: write
  packages: read

concurrency:
  group: scad-production-${{ github.repository_id }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: SCAD production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      affected: ${{ steps.result.outputs.affected }}
      affected_capabilities: ${{ steps.result.outputs.affected_capabilities }}
      source_sha: ${{ steps.range.outputs.source_sha }}
      base_sha: ${{ steps.range.outputs.base_sha }}
    env:
      SCAD_PROJECT_WORKFLOW_VERSION: v0.14.3
      SCAD_TOOLCHAIN_VERSION: v0.5.0
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Resolve exact source and comparison base
        id: range
        shell: bash
        env:
          SOURCE_INPUT: ${{ inputs.source_sha }}
          BASE_INPUT: ${{ inputs.base_sha }}
          FORCE: ${{ inputs.force }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail

          source_sha="$SOURCE_INPUT"
          if [[ -z "$source_sha" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PR_HEAD_SHA" ]]; then
              source_sha="$PR_HEAD_SHA"
            else
              source_sha="$GITHUB_SHA"
            fi
          fi
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: source_sha must resolve to an exact 40-character commit SHA" >&2
            exit 1
          fi

          base_sha="$BASE_INPUT"
          if [[ "$FORCE" == "true" ]]; then
            base_sha="0000000000000000000000000000000000000000"
            echo "Force requested; impact query will deliberately fail conservative."
          elif [[ -z "$base_sha" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
              base_sha="$PR_BASE_SHA"
            elif [[ "$GITHUB_EVENT_NAME" == "push" && -n "$PUSH_BEFORE_SHA" ]]; then
              base_sha="$PUSH_BEFORE_SHA"
            else
              base_sha="0000000000000000000000000000000000000000"
              echo "No unambiguous event base is available; impact query will fail conservative."
            fi
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid base_sha supplied; using a missing revision for conservative production."
            base_sha="0000000000000000000000000000000000000000"
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "SCAD impact range: $base_sha -> $source_sha"

      - name: Checkout exact source for host orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.range.outputs.source_sha }}
          fetch-depth: 1
          filter: blob:none
          submodules: false
          persist-credentials: false

      - name: Fetch only the exact comparison base
        shell: bash
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "No concrete comparison base; Moon will return a conservative decision."
          elif git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            git rev-parse --verify "${BASE_SHA}^{commit}"
            echo "Fetched exact comparison base as a shallow history root."
          else
            echo "Comparison base could not be fetched; Moon will return a conservative decision."
          fi

      - name: Initialize pinned shared SCAD task policy
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- tools/tool.scad-project
          test -f tools/tool.scad-project/moon/tasks/scad.yml
          echo "SCAD task policy: $(git -C tools/tool.scad-project rev-parse HEAD)"

      - name: Make exact base SCAD task policy revision available
        timeout-minutes: 2
        shell: bash
        env:
          BASE_SHA: ${{ steps.range.outputs.base_sha }}
        run: |
          set -euo pipefail
          bash tools/tool.scad-project/scripts/fetch_base_gitlink_commit.sh \
            "$BASE_SHA" \
            tools/tool.scad-project

      - name: Query affected Moon tasks once
        id: affected
        uses: brainboxemb/tool.git-project/moon/affected@v0.2.8
        with:
          task: consumer:scad.docs
          base: ${{ steps.range.outputs.base_sha }}
          head: ${{ steps.range.outputs.source_sha }}
          evidence-directory: .moon/preflight

      - name: Classify impact result
        id: impact
        shell: bash
        env:
          AFFECTED_TASKS: ${{ steps.affected.outputs.affected-tasks }}
        run: |
          set -euo pipefail
          status="$(jq -r '.status' .moon/preflight/decision.json)"
          tasks="$AFFECTED_TASKS"
          case "$status" in
            success|conservative) ;;
            *) echo "ERROR: unsupported Moon decision status: $status" >&2; exit 1 ;;
          esac
          case "$tasks" in
            \[*\]) ;;
            *) echo "ERROR: affected-tasks is not a JSON array: $tasks" >&2; exit 1 ;;
          esac

          needs_plan=false
          if [[ "$status" == conservative || "$tasks" != '[]' ]]; then
            needs_plan=true
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "needs_plan=$needs_plan" >> "$GITHUB_OUTPUT"
          echo "affected_tasks=$tasks" >> "$GITHUB_OUTPUT"

          {
            echo "## SCAD impact control"
            echo ""
            echo "- source: \`${{ steps.range.outputs.source_sha }}\`"
            echo "- base: \`${{ steps.range.outputs.base_sha }}\`"
            echo "- Moon decision: \`$status\`"
            echo "- affected Moon tasks: \`$tasks\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up host Python only for possible SCAD work
        if: steps.impact.outputs.needs_plan == 'true'
        timeout-minutes: 2
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact pinned SCAD planner
        if: steps.impact.outputs.needs_plan == 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ./tools/tool.scad-project

      - name: Validate tooling alignment and build SCAD execution plan
        id: plan
        if: steps.impact.outputs.needs_plan == 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          scad-project tooling-check
          plan_file=.moon/preflight/scad-ci-plan.json
          python -m scad_project.ci_policy \
            --affected-tasks .moon/preflight/affected-task-ids.json \
            --decision .moon/preflight/decision.json \
            > "$plan_file"
          cat "$plan_file"

          echo "runtime_profile=$(jq -r '.runtime_profile' "$plan_file")" >> "$GITHUB_OUTPUT"
          echo "runtime_image=$(jq -r '.runtime_image' "$plan_file")" >> "$GITHUB_OUTPUT"
          echo "build_engine=$(jq -r '.build_engine' "$plan_file")" >> "$GITHUB_OUTPUT"
          echo "use_scons_cache=$(jq -r '.use_scons_cache' "$plan_file")" >> "$GITHUB_OUTPUT"
          echo "use_verification_scons_cache=$(jq -r '.use_verification_scons_cache' "$plan_file")" >> "$GITHUB_OUTPUT"
          echo "run_runtime=$(jq -r '.run_runtime' "$plan_file")" >> "$GITHUB_OUTPUT"
          echo "publish_build=$(jq -r '.publish_build' "$plan_file")" >> "$GITHUB_OUTPUT"
          echo "publish_verification=$(jq -r '.publish_verification' "$plan_file")" >> "$GITHUB_OUTPUT"
          echo "build_root=$(jq -r '.build_root' "$plan_file")" >> "$GITHUB_OUTPUT"
          echo "verification_root=$(jq -r '.verification_root' "$plan_file")" >> "$GITHUB_OUTPUT"
          echo "affected_capabilities=$(jq -c '.affected_capabilities' "$plan_file")" >> "$GITHUB_OUTPUT"
          echo "materialization_capabilities=$(jq -r '.materialization_capabilities | join(" ")' "$plan_file")" >> "$GITHUB_OUTPUT"

          echo "SCAD_TOOLCHAIN_IMAGE=$(jq -r '.runtime_image' "$plan_file")" >> "$GITHUB_ENV"
          echo "SCAD_PROJECT_TOOL_SHA=$(git -C tools/tool.scad-project rev-parse HEAD)" >> "$GITHUB_ENV"

          {
            echo ""
            echo "## SCAD execution plan"
            echo ""
            echo "- affected capabilities: \`$(jq -c '.affected_capabilities' "$plan_file")\`"
            echo "- materialization scope: \`$(jq -c '.materialization_capabilities' "$plan_file")\`"
            echo "- runtime profile: \`$(jq -r '.runtime_profile' "$plan_file")\`"
            echo "- build engine: \`$(jq -r '.build_engine' "$plan_file")\`"
            echo "- normal SCons transport: \`$(jq -r '.use_scons_cache' "$plan_file")\`"
            echo "- Verification SCons transport: \`$(jq -r '.use_verification_scons_cache' "$plan_file")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore portable Moon capability cache
        if: steps.plan.outputs.run_runtime == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .moon/cache/hashes
            .moon/cache/outputs
          key: tool-git-project-moon-2.5.4-${{ runner.os }}-${{ inputs.cache_namespace }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tool-git-project-moon-2.5.4-${{ runner.os }}-${{ inputs.cache_namespace }}-

      - name: Restore configured normal SCons cache
        id: build-cache
        if: steps.plan.outputs.run_runtime == 'true' && steps.plan.outputs.use_scons_cache == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/scad-project/scons
          key: scad-production-build-scons-v2-${{ runner.os }}-${{ github.repository_id }}-v0.5.0-${{ env.SCAD_PROJECT_TOOL_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scad-production-build-scons-v2-${{ runner.os }}-${{ github.repository_id }}-v0.5.0-${{ env.SCAD_PROJECT_TOOL_SHA }}-

      - name: Restore configured Verification SCons cache
        id: verification-cache
        if: steps.plan.outputs.run_runtime == 'true' && steps.plan.outputs.use_verification_scons_cache == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/scad-project/verification-scons
          key: scad-production-verification-scons-v2-${{ runner.os }}-${{ github.repository_id }}-v0.5.0-${{ env.SCAD_PROJECT_TOOL_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scad-production-verification-scons-v2-${{ runner.os }}-${{ github.repository_id }}-v0.5.0-${{ env.SCAD_PROJECT_TOOL_SHA }}-

      - name: Pull capability-appropriate SCAD runtime
        if: steps.plan.outputs.run_runtime == 'true'
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_IMAGE: ${{ steps.plan.outputs.runtime_image }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$RUNTIME_IMAGE"
          docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Execute or hydrate required SCAD capabilities in one Docker process
        if: steps.plan.outputs.run_runtime == 'true'
        timeout-minutes: 10
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.range.outputs.source_sha }}
          RUNTIME_IMAGE: ${{ steps.plan.outputs.runtime_image }}
          MATERIALIZATION_CAPABILITIES: ${{ steps.plan.outputs.materialization_capabilities }}
        run: |
          set -euo pipefail

          moon_runtime="$RUNNER_TEMP/tool-git-project/moon-runtime"
          git_tool_action_root="$(realpath "$GITHUB_WORKSPACE/../../_actions/brainboxemb/tool.git-project/v0.2.8")"
          test -d "$moon_runtime"
          test -f "$git_tool_action_root/moon-project.sh"
          test "$(tr -d '\r\n' < "$git_tool_action_root/VERSION")" = 0.2.8

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            -e GITHUB_WORKSPACE=/work \
            -e "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" \
            -e "GITHUB_SHA=$SOURCE_SHA" \
            -e "SCAD_PROJECT_SOURCE_SHA=$SOURCE_SHA" \
            -e "SCAD_PROJECT_TOOL_SHA=$SCAD_PROJECT_TOOL_SHA" \
            -e "SCAD_PROJECT_WORKFLOW_VERSION=$SCAD_PROJECT_WORKFLOW_VERSION" \
            -e "SCAD_TOOLCHAIN_IMAGE=$RUNTIME_IMAGE" \
            -e "SCAD_TOOLCHAIN_VERSION=$SCAD_TOOLCHAIN_VERSION" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e MOON_INSTALL_ROOT=/moon-runtime \
            -e "MATERIALIZATION_CAPABILITIES=$MATERIALIZATION_CAPABILITIES" \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$moon_runtime:/moon-runtime" \
            -v "$git_tool_action_root:/tool-git-v028:ro" \
            -w /work \
            "$RUNTIME_IMAGE" bash -lc '
              set -euo pipefail
              git config --global --add safe.directory /work
              bash ./bootstrap.sh
              git config --global --add safe.directory /work/tools/tool.git-project
              git config --global --add safe.directory /work/tools/tool.scad-project
              bash ./tools/tool.scad-project/scad-project.sh tooling-check
              scad-toolchain-info
              for capability in $MATERIALIZATION_CAPABILITIES; do
                echo "Moon materialization: consumer:$capability"
                bash /tool-git-v028/moon-project.sh run "consumer:$capability" --repo . --install-root /moon-runtime
              done
            '

      - name: Save normal SCons cache when actually configured and populated
        if: always() && steps.plan.outputs.run_runtime == 'true' && steps.plan.outputs.use_scons_cache == 'true' && steps.build-cache.outputs.cache-hit != 'true' && hashFiles('.cache/scad-project/scons/**') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/scad-project/scons
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Save Verification SCons cache when actually configured and populated
        if: always() && steps.plan.outputs.run_runtime == 'true' && steps.plan.outputs.use_verification_scons_cache == 'true' && steps.verification-cache.outputs.cache-hit != 'true' && hashFiles('.cache/scad-project/verification-scons/**') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/scad-project/verification-scons
          key: ${{ steps.verification-cache.outputs.cache-primary-key }}

      - name: Validate capability materialization
        if: steps.plan.outputs.run_runtime == 'true'
        timeout-minutes: 2
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.range.outputs.source_sha }}
          MATERIALIZATION_CAPABILITIES: ${{ steps.plan.outputs.materialization_capabilities }}
        run: |
          set -euo pipefail
          for capability in $MATERIALIZATION_CAPABILITIES; do
            evidence_dir=".moon/invocations/consumer_${capability}"
            test -s "$evidence_dir/moon.log"
            test -s "$evidence_dir/materialization.json"
            SOURCE_SHA="$SOURCE_SHA" CAPABILITY="consumer:$capability" EVIDENCE_DIR="$evidence_dir" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["EVIDENCE_DIR"]) / "materialization.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "task": os.environ["CAPABILITY"],
              "source_revision": os.environ["SOURCE_SHA"],
              "status": "success",
              "exit_code": 0,
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f"{path}: {key} mismatch: {data.get(key)!r} != {value!r}")
          PY
          done

      - name: Add current-run Build finishing information
        if: steps.plan.outputs.publish_build == 'true'
        timeout-minutes: 2
        shell: bash
        env:
          SCAD_PROJECT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          scad-project build-index
          scad-project publication-info-build

      - name: Add current-run Verification finishing information
        if: steps.plan.outputs.publish_verification == 'true'
        timeout-minutes: 2
        shell: bash
        env:
          SCAD_PROJECT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          scad-project publication-info-verification

      - name: Stage changed publication families with current orchestration evidence
        if: steps.plan.outputs.run_runtime == 'true'
        timeout-minutes: 2
        shell: bash
        env:
          BUILD_ROOT: ${{ steps.plan.outputs.build_root }}
          VERIFICATION_ROOT: ${{ steps.plan.outputs.verification_root }}
          PUBLISH_BUILD: ${{ steps.plan.outputs.publish_build }}
          PUBLISH_VERIFICATION: ${{ steps.plan.outputs.publish_verification }}
        run: |
          set -euo pipefail
          build_staging="$RUNNER_TEMP/scad-build-publication"
          verification_staging="$RUNNER_TEMP/scad-verification-publication"
          rm -rf "$build_staging" "$verification_staging"

          add_orchestration() {
            local staging="$1"
            mkdir -p "$staging/orchestration"
            cp .moon/preflight/decision.json "$staging/orchestration/impact-decision.json"
            cp .moon/preflight/affected-task-ids.json "$staging/orchestration/affected-task-ids.json"
            cp .moon/preflight/scad-ci-plan.json "$staging/orchestration/scad-ci-plan.json"
            if [[ -d .moon/invocations ]]; then
              cp -a .moon/invocations "$staging/orchestration/moon-invocations"
            fi
          }

          if [[ "$PUBLISH_BUILD" == true ]]; then
            test -d "$BUILD_ROOT"
            find "$BUILD_ROOT" -mindepth 1 -print -quit | grep -q .
            mkdir -p "$build_staging"
            cp -a "$BUILD_ROOT"/. "$build_staging/"
            add_orchestration "$build_staging"
          fi

          if [[ "$PUBLISH_VERIFICATION" == true ]]; then
            test -d "$VERIFICATION_ROOT"
            find "$VERIFICATION_ROOT" -mindepth 1 -print -quit | grep -q .
            mkdir -p "$verification_staging"
            cp -a "$VERIFICATION_ROOT"/. "$verification_staging/"
            add_orchestration "$verification_staging"
          fi

      - name: Publish changed Build and Verification families concurrently on this runner
        if: inputs.publish && steps.plan.outputs.run_runtime == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        timeout-minutes: 5
        shell: bash
        env:
          PUBLISH_BUILD: ${{ steps.plan.outputs.publish_build }}
          PUBLISH_VERIFICATION: ${{ steps.plan.outputs.publish_verification }}
          BUILD_SUFFIX: ${{ inputs.build_branch_suffix }}
          VERIFICATION_SUFFIX: ${{ inputs.verification_branch_suffix }}
          SOURCE_SHA: ${{ steps.range.outputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail
          publisher="$(realpath "$GITHUB_WORKSPACE/../../_actions/brainboxemb/tool.git-project/v0.2.8/generated-output-publish.sh")"
          test -f "$publisher"

          pids=()
          names=()

          start_publisher() {
            local name="$1" source_dir="$2" suffix="$3" output_file="$4"
            (
              export GITHUB_OUTPUT="$output_file"
              export PUBLISH_SOURCE_DIR="$source_dir"
              export PUBLISH_BRANCH_SUFFIX="$suffix"
              export PUBLISH_SOURCE_REVISION="$SOURCE_SHA"
              export PUBLISH_TOKEN="$GH_TOKEN"
              export PUBLISH_PR_NUMBER="$PR_NUMBER"
              export PUBLISH_PR_HEAD_REF="$PR_HEAD_REF"
              export PUBLISH_PR_HEAD_SHA="$PR_HEAD_SHA"
              export PUBLISH_PR_HEAD_REPOSITORY="$PR_HEAD_REPOSITORY"
              bash "$publisher"
            ) >"$RUNNER_TEMP/${name}-publisher.log" 2>&1 &
            pids+=("$!")
            names+=("$name")
          }

          if [[ "$PUBLISH_BUILD" == true ]]; then
            start_publisher build "$RUNNER_TEMP/scad-build-publication" "$BUILD_SUFFIX" "$RUNNER_TEMP/build-publisher.out"
          fi
          if [[ "$PUBLISH_VERIFICATION" == true ]]; then
            start_publisher verification "$RUNNER_TEMP/scad-verification-publication" "$VERIFICATION_SUFFIX" "$RUNNER_TEMP/verification-publisher.out"
          fi

          failed=0
          for i in "${!pids[@]}"; do
            if wait "${pids[$i]}"; then
              echo "${names[$i]} publication: success"
            else
              echo "${names[$i]} publication: failed" >&2
              failed=1
            fi
            cat "$RUNNER_TEMP/${names[$i]}-publisher.log"
          done
          exit "$failed"

      - name: Upload compact SCAD orchestration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.evidence_artifact_name }}
          path: |
            .moon/preflight
            .moon/invocations
            .cache/scad-project/state/last-design-build.json
            .cache/scad-project/state/last-build.json
            .cache/scad-project/verification-state/last-verification-build.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Resolve reusable workflow result
        id: result
        if: always()
        shell: bash
        env:
          RUN_RUNTIME: ${{ steps.plan.outputs.run_runtime }}
          AFFECTED_CAPABILITIES: ${{ steps.plan.outputs.affected_capabilities }}
        run: |
          affected=false
          capabilities='[]'
          if [[ "$RUN_RUNTIME" == true ]]; then
            affected=true
          fi
          if [[ "$AFFECTED_CAPABILITIES" == \[*\] ]]; then
            capabilities="$AFFECTED_CAPABILITIES"
          fi
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          echo "affected_capabilities=$capabilities" >> "$GITHUB_OUTPUT"
