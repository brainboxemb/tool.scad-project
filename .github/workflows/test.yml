name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.4.1

    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v4

      - name: Install package
        timeout-minutes: 2
        run: python3 -m pip install --break-system-packages -e '.[test]'

      - name: Show runtime
        timeout-minutes: 2
        run: scad-toolchain-info

      - name: Installed CLI smoke
        timeout-minutes: 2
        run: scad-project --help

      - name: Source launcher smoke
        timeout-minutes: 2
        run: bash ./scad-project.sh --help

      - name: Unit tests
        timeout-minutes: 5
        run: pytest -q

      - name: Generate unit-test documentation
        timeout-minutes: 2
        run: |
          python3 scripts/generate_test_reference.py --output bld/test-docs/index.html
          test -f bld/test-docs/index.html

      - name: Upload unit-test documentation
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-documentation
          path: bld/test-docs
          if-no-files-found: error
          retention-days: 14
