name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release-markers:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/pr-58-optional-verification-state-output' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout owner branch
        uses: actions/checkout@v4
        with:
          ref: feature/pr-58-optional-verification-state-output
          fetch-depth: 1

      - name: Align v0.14.3 markers and restore normal workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for name in (
              '.github/workflows/project-build.yml',
              '.github/workflows/project-verify.yml',
              '.github/workflows/project-production.yml',
              '.github/workflows/project-pr-cleanup.yml',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              old = 'SCAD_PROJECT_WORKFLOW_VERSION: v0.14.2'
              new = 'SCAD_PROJECT_WORKFLOW_VERSION: v0.14.3'
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one v0.14.2 workflow marker')
              path.write_text(text.replace(old, new), encoding='utf-8')

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          old = 'version = "0.14.2"'
          if text.count(old) != 1:
              raise SystemExit('pyproject.toml: expected v0.14.2 package version')
          pyproject.write_text(text.replace(old, 'version = "0.14.3"'), encoding='utf-8')

          init = Path('src/scad_project/__init__.py')
          text = init.read_text(encoding='utf-8')
          old = '__version__ = "0.14.2"'
          if text.count(old) != 1:
              raise SystemExit('__init__.py: expected v0.14.2 runtime version')
          init.write_text(text.replace(old, '__version__ = "0.14.3"'), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if '## v0.14.3' in text:
              raise SystemExit('CHANGELOG.md already contains v0.14.3')
          anchor = '## v0.14.1\n'
          if anchor not in text:
              raise SystemExit('CHANGELOG.md: v0.14.1 anchor missing')
          release_notes = '''## v0.14.3

### Fixed

- Allow `scad.verify` to cache Verification-SCons state when it exists without requiring that optional state from command-only verification consumers; `vrf/out/**` remains the required verification output family.
- Add regression coverage for the inherited Moon verification-output contract exposed by the Migration-005 HUB75 canary.

## v0.14.2

### Fixed

- Read Migration-005 inherited capability selection from project-level `moon.yml` through `workspace.inheritedTasks.include`, matching Moon 2.5.4; keep `.moon/workspace.yml` for workspace-level configuration.

'''
          changelog.write_text(text.replace(anchor, release_notes + anchor, 1), encoding='utf-8')

          Path('.github/workflows/prepare-v0143.yml').unlink(missing_ok=True)
          PY

          git fetch --no-tags --depth=1 origin main
          git checkout FETCH_HEAD -- .github/workflows/test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align tool.scad-project v0.14.3 release markers'
          git push origin HEAD:feature/pr-58-optional-verification-state-output

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.5.0
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v4

      - name: Clean planner install smoke
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip uninstall --break-system-packages -y setuptools wheel >/dev/null 2>&1 || true
          python3 - <<'PY'
          import importlib.util
          if importlib.util.find_spec("setuptools") is not None:
              raise SystemExit("clean planner test still has setuptools before install")
          PY
          python3 -m pip install --break-system-packages --disable-pip-version-check -e .
          scad-project --help >/dev/null
          python3 -m pip install --break-system-packages --disable-pip-version-check 'setuptools>=70' wheel >/dev/null

      - name: Install package
        timeout-minutes: 2
        run: python3 -m pip install --break-system-packages -e '.[test]'

      - name: Show runtime
        timeout-minutes: 2
        run: scad-toolchain-info

      - name: Installed CLI smoke
        timeout-minutes: 2
        run: scad-project --help

      - name: Source launcher smoke
        timeout-minutes: 2
        run: bash ./scad-project.sh --help

      - name: Unit tests
        timeout-minutes: 5
        run: pytest -q

      - name: Generate unit-test documentation
        timeout-minutes: 2
        run: |
          python3 scripts/generate_test_reference.py --output bld/test-docs/index.html
          test -f bld/test-docs/index.html

      - name: Upload unit-test documentation
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-documentation
          path: bld/test-docs
          if-no-files-found: error
          retention-days: 14
