name: One-shot release v0.7.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_dispatch-release-v0.7.2.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Dispatch permanent v0.7.2 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: 05f3d1630b02d69bc38b18b096595245ee1fb59f
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD="$(jq -nc \
            --arg ref "main" \
            --arg version "v0.7.2" \
            --arg release_sha "${RELEASE_SHA}" \
            '{ref: $ref, inputs: {version: $version, release_sha: $release_sha}}')"

          printf '%s' "${PAYLOAD}" | gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            --input -

          echo "Dispatched release.yml for v0.7.2 at ${RELEASE_SHA}."
