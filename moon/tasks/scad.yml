tasks:
  scad.docs:
    description: Build SCAD design documentation.
    command: 'python3 tools/tool.scad-project/scripts/run_scad_capability.py design-build'
    inputs:
      - 'project.yml'
      - 'project.scad.yml'
      - '.gitmodules'
      - 'tools/tool.scad-project/scad-project.sh'
      - 'tools/tool.scad-project/pyproject.toml'
      - 'tools/tool.scad-project/src/**/*.py'
      - 'tools/tool.scad-project/scripts/run_scad_capability.py'
    outputs:
      - 'bld/design/**'
      - 'bld/evidence/executions/scad-docs/**'
    options:
      cache: true

  scad.build:
    description: Build configured presentation/render/export output.
    command: 'python3 tools/tool.scad-project/scripts/run_scad_capability.py build'
    inputs:
      - 'project.yml'
      - 'project.scad.yml'
      - '.gitmodules'
      - 'tools/tool.scad-project/scad-project.sh'
      - 'tools/tool.scad-project/pyproject.toml'
      - 'tools/tool.scad-project/src/**/*.py'
      - 'tools/tool.scad-project/scripts/run_scad_capability.py'
    outputs:
      - 'bld/png/**'
      - 'bld/stl/**'
      - 'bld/evidence/executions/scad-build/**'
    options:
      cache: true

  scad.verify:
    description: Run SCAD project verification.
    command: 'python3 tools/tool.scad-project/scripts/run_scad_capability.py verify'
    inputs:
      - 'project.yml'
      - 'project.scad.yml'
      - '.gitmodules'
      - 'tools/tool.scad-project/scad-project.sh'
      - 'tools/tool.scad-project/pyproject.toml'
      - 'tools/tool.scad-project/src/**/*.py'
      - 'tools/tool.scad-project/scripts/run_scad_capability.py'
    outputs:
      - 'vrf/out/**'
    options:
      cache: true
