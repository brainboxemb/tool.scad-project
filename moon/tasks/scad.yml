tasks:
  scad.docs:
    description: Build SCAD design documentation.
    command: 'bash tools/tool.scad-project/scad-project.sh design-build'
    inputs:
      - 'project.yml'
      - 'project.scad.yml'
      - '.gitmodules'
      - 'tools/tool.scad-project/scad-project.sh'
      - 'tools/tool.scad-project/pyproject.toml'
      - 'tools/tool.scad-project/src/**/*.py'
    outputs:
      - 'bld/design/**'
      - 'bld/evidence/executions/scad-docs/**'
    options:
      cache: true

  scad.build:
    description: Build configured presentation/render/export output.
    command: 'bash tools/tool.scad-project/scad-project.sh build'
    inputs:
      - 'project.yml'
      - 'project.scad.yml'
      - '.gitmodules'
      - 'tools/tool.scad-project/scad-project.sh'
      - 'tools/tool.scad-project/pyproject.toml'
      - 'tools/tool.scad-project/src/**/*.py'
    outputs:
      - 'bld/png/**'
      - 'bld/stl/**'
      - 'bld/evidence/executions/scad-build/**'
    options:
      cache: true

  scad.verify:
    description: Run SCAD project verification.
    command: 'bash tools/tool.scad-project/scad-project.sh verify'
    inputs:
      - 'project.yml'
      - 'project.scad.yml'
      - '.gitmodules'
      - 'tools/tool.scad-project/scad-project.sh'
      - 'tools/tool.scad-project/pyproject.toml'
      - 'tools/tool.scad-project/src/**/*.py'
    outputs:
      - 'vrf/out/**'
    options:
      cache: true
