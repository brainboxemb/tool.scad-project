paths:
  design_root: dsg/openscad
  build_root: bld
  # One render_root remains supported. Multiple roots are useful when
  # separating normal 3D PNG renders from true 2D SVG drawing entrypoints.
  render_roots:
    - dsg/openscad/render3d
    - dsg/openscad/render2d
  export_root: dsg/openscad/export

design:
  # Set false in consumers that should publish only project-owned design docs.
  include_externals: true

build_engine:
  # Omit this section to keep the backwards-compatible direct build engine.
  engine: scons

openscad:
  common_flags:
    - --enable=object-function
  render_flags:
    - --render
  image_size: [1600, 1000]
  # Default for generated design-documentation images. A document can override
  # this with scad-render-defaults `size`, and an individual scad-render can
  # override both with its own `size: [width, height]`.
  design_image_size: [640, 480]

publication:
  production:
    source_branch: main
    build_branch: prod/bld
    verification_branch: prod/vrf

  development:
    # An open PR #42 publishes to dev/pr-42/bld and dev/pr-42/vrf.
    # Ordinary feature-branch pushes are artifact-only by default.
    pr_branch_prefix: dev/pr

  tags:
    pattern: "v*"

  release:
    branch_prefix: rel
    tag_pattern: "v*"
    changelog: CHANGELOG.md
