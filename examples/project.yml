project:
  name: example.scad-project

tooling:
  tool_scad_project_version: v0.4.1

paths:
  design_root: dsg/openscad
  build_root: bld

openscad:
  common_flags:
    - --enable=object-function
  render_flags:
    - --render
  image_size: [1600, 1000]
  design_image_size: [640, 480]

publication:
  build_branch: build
