project:
  name: example.scad-project

tooling:
  tool_scad_project:
    type: git-submodule
    url: https://github.com/brainboxemb/tool.scad-project.git
    path: tools/tool.scad-project
    ref: v0.8.0

paths:
  design_root: dsg/openscad
  build_root: bld

design:
  # Set false in consumers that should publish only project-owned design docs.
  include_externals: true

build_engine:
  # Omit this section to keep the backwards-compatible direct build engine.
  engine: scons

openscad:
  common_flags:
    - --enable=object-function
  render_flags:
    - --render
  image_size: [1600, 1000]
  design_image_size: [640, 480]

publication:
  build_branch: build
