project:
  name: example.scad-project

tooling:
  tool_scad_project:
    type: git-submodule
    url: https://github.com/brainboxemb/tool.scad-project.git
    path: tools/tool.scad-project
    ref: v0.9.9

paths:
  design_root: dsg/openscad
  build_root: bld

design:
  # Set false in consumers that should publish only project-owned design docs.
  include_externals: true

build_engine:
  # Omit this section to keep the backwards-compatible direct build engine.
  engine: scons

openscad:
  common_flags:
    - --enable=object-function
  render_flags:
    - --render
  image_size: [1600, 1000]
  # Default for generated design-documentation images. A document can override
  # this with scad-render-defaults `size`, and an individual scad-render can
  # override both with its own `size: [width, height]`.
  design_image_size: [640, 480]

publication:
  production:
    source_branch: main
    build_branch: prod/build
    verification_branch: prod/verification

  development:
    build_branch: dev/build
    verification_branch: dev/verification

  tags:
    pattern: "v*"

  release:
    branch_prefix: rel
    tag_pattern: "v*"
    changelog: CHANGELOG.md
